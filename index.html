/* =====================================================================
   SANTARÉM FLORES — estilos do site
   Layout: segue a imagem de referência (cabeçalho com menu em caixa-alta,
   banners largos de flores, faixa de texto central, grid de produtos,
   faixas coloridas, seções texto+foto, carrossel de cards e rodapé em faixa).
   Identidade: marrom #17301f e amarelo #d9b061 da logo, fundo off-white.
   Índice: 1 Tokens · 2 Base · 3 Botões · 4 Header · 5 Hero · 6 Catálogo
           7 Cards · 8 Detalhe · 9 Faixa · 10 Destaque · 11 Sobre · 12 Como pedir
           13 Footer · 14 Movimento
   ===================================================================== */

/* 1 · TOKENS ---------------------------------------------------------- */
:root {
  --bg: #fbf8f1;            /* off-white */
  --band: #e8eedd;          /* faixa suave (amarelo da marca diluído) */
  --ink: #17301f;           /* marrom da logo */
  --ink-soft: #566b5c;
  --line: rgba(23, 48, 31, .16);
  --brown: #17301f;
  --yellow: #d9b061;        /* amarelo da logo */
  --rose: #e08792;          /* só em detalhes: coração favorito */
  --photo-bg: #efe8da;
  --font: "Jost", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --gutter: clamp(20px, 5vw, 64px);
  --max: 1240px;
  --header-h: 64px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}

/* 2 · BASE ------------------------------------------------------------ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--header-h) + 8px); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body { margin: 0; font-family: var(--font); font-size: 1rem; line-height: 1.65; font-weight: 400; color: var(--ink); background: var(--bg); overflow-x: clip; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
:root:has(dialog[open]), :root:has(.nav.is-open) { overflow: hidden; }
[hidden] { display: none !important; }
img { display: block; max-width: 100%; height: auto; }
h1, h2, h3, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
h1, h2, h3 { font-weight: 300; line-height: 1.15; text-wrap: balance; }
p { text-wrap: pretty; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
.container { width: min(100% - 2 * var(--gutter), var(--max)); margin-inline: auto; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.icon { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.skip-link { position: absolute; left: 12px; top: -60px; z-index: 100; padding: 10px 16px; background: var(--yellow); color: var(--ink); border-radius: 999px; text-decoration: none; font-weight: 500; }
.skip-link:focus { top: 12px; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; box-shadow: 0 0 0 5px var(--yellow); }

.sec-head { display: grid; justify-items: center; gap: 10px; text-align: center; }
.sec-title { font-size: clamp(1.55rem, 1.1rem + 1.7vw, 2.4rem); font-weight: 300; text-transform: uppercase; letter-spacing: .02em; text-align: center; }
.sec-sub { color: var(--ink-soft); font-weight: 300; }

/* 3 · BOTÕES (pílula, como na referência) ------------------------------ */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .55em; min-height: 52px; padding: 0 34px; border: 1.5px solid transparent; border-radius: 999px; font-size: 1rem; font-weight: 400; letter-spacing: .01em; line-height: 1.1; text-decoration: none; text-align: center; transition: background-color .3s var(--ease), color .3s var(--ease), border-color .3s var(--ease), transform .3s var(--ease); }
.btn:active { transform: translateY(1px); }
.btn--brown { background: var(--brown); color: var(--bg); }
.btn--brown:hover { background: var(--yellow); color: var(--brown); border-color: var(--brown); }
.btn--line { border-color: var(--brown); color: var(--brown); }
.btn--line:hover { background: var(--brown); color: var(--bg); }
.btn--sm { min-height: 42px; padding: 0 20px; font-size: .9rem; }
.btn--block { width: 100%; }

/* 13c · PEDIDO, LOGIN E EDITOR (janelas) --------------------------------- */
.order, .login, .editor { width: 100%; max-width: 100%; max-height: 94dvh; margin: auto 0 0; padding: 0; border: 0; border-radius: 16px 16px 0 0; background: var(--bg); color: var(--ink); overflow: hidden; }
.order::backdrop, .login::backdrop, .editor::backdrop { background: rgba(31, 18, 13, .72); }
.order[open], .login[open], .editor[open] { animation: sheet-in .5s var(--ease); }
.order__inner, .login__inner { position: relative; max-height: 94dvh; overflow-y: auto; overscroll-behavior: contain; }
@media (min-width: 700px) {
  .order, .login { width: min(560px, 100% - 48px); margin: auto; max-height: calc(100dvh - 48px); border-radius: 8px; }
  .login { width: min(430px, 100% - 48px); }
  .order__inner, .login__inner { max-height: calc(100dvh - 48px); }
}
.of { display: grid; gap: 18px; padding: 28px clamp(20px, 5vw, 36px) 30px; }
.of__product { display: flex; gap: 16px; align-items: center; padding-right: 48px; }
.of__product img { width: 72px; height: 96px; object-fit: cover; background: var(--photo-bg); }
.of__title { font-size: 1.4rem; font-weight: 300; text-transform: uppercase; letter-spacing: .05em; }
.of__name { margin-top: 2px; font-size: 1.1rem; line-height: 1.25; }
.of__price { font-weight: 500; }
.of__price--ask { font-weight: 300; font-style: italic; color: var(--ink-soft); }
.of__field { display: grid; gap: 6px; margin: 0; padding: 0; border: 0; min-width: 0; }
.of__field > span, .of__choice legend { font-size: .9rem; font-weight: 500; padding: 0; }
.of__field small { color: var(--ink-soft); font-size: .85rem; }
.of__field input[type="text"], .of__field input[type="password"], .of__field textarea { width: 100%; min-height: 50px; padding: 12px 16px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; font: inherit; color: inherit; }
.of__field textarea { resize: vertical; }
.of__field input:focus, .of__field textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px var(--yellow); }
.of__field .of__hand { font-family: "Caveat", "Segoe Script", cursive; font-size: 1.55rem; line-height: 1.2; }
.of__choice { margin: 0; padding: 0; border: 0; min-width: 0; }
.of__choice legend { margin-bottom: 8px; }
.of__toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.of__toggle label { position: relative; display: block; }
.of__toggle input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.of__toggle span { display: grid; place-items: center; min-height: 54px; padding: 0 12px; border: 1.5px solid var(--ink); border-radius: 999px; text-align: center; line-height: 1.2; transition: background-color .3s, color .3s; }
.of__toggle input:checked + span { background: var(--brown); color: var(--bg); }
.of__toggle input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 3px; box-shadow: 0 0 0 5px var(--yellow); }
.of__delivery { display: grid; gap: 16px; animation: fade-in .4s ease; }
.of__special-btn { display: inline-flex; align-items: center; gap: 10px; justify-self: start; min-height: 48px; padding: 0 20px; border: 1.5px dashed var(--ink); border-radius: 999px; background: none; transition: background-color .3s; }
.of__special-btn[aria-expanded="true"] { background: var(--band); }
.of__error { padding: 12px 14px; background: #fbe9e7; color: #7f1f1f; border-left: 3px solid #a12b2b; font-size: .95rem; }
.of__lead { color: var(--ink-soft); font-weight: 300; }
.of__row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.of__row .btn { min-height: 48px; padding: 0 14px; font-size: .95rem; }
.of__hint { font-size: .9rem; color: var(--ink-soft); font-weight: 300; }
.of__img { display: block; width: auto; max-width: 100%; max-height: 62dvh; height: auto; margin-inline: auto; border: 1px solid var(--line); background: #fff; }
.of--done { padding-top: 32px; }
.lg { display: grid; gap: 16px; justify-items: center; padding: 34px clamp(20px, 5vw, 36px) 30px; text-align: center; }
.lg label, .lg .btn, .lg .of__error { width: 100%; text-align: left; }
.lg__logo { border-radius: 50%; }
.lg h2 { font-size: 1.4rem; font-weight: 300; text-transform: uppercase; letter-spacing: .05em; }
.lg__note { font-size: .85rem; color: var(--ink-soft); }

.editor { height: min(94dvh, 100%); }
.editor__inner { display: flex; flex-direction: column; height: 100%; max-height: 94dvh; }
@media (min-width: 820px) {
  .editor { width: min(980px, 100% - 48px); height: min(820px, 100dvh - 48px); margin: auto; border-radius: 8px; }
  .editor__inner { max-height: none; }
}
.ed__bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; padding: 14px clamp(16px, 3vw, 28px); border-bottom: 1px solid var(--line); }
.ed__bar h2 { font-size: 1.25rem; font-weight: 300; text-transform: uppercase; letter-spacing: .05em; }
.ed__actions { display: flex; align-items: center; gap: 8px; }
.ed__link { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 6px; border: 0; background: none; text-decoration: underline; text-underline-offset: 4px; }
.ed__x { display: grid; place-items: center; width: 40px; height: 40px; border: 0; background: none; }
.ed__back { margin: 0 0 4px -6px; }
.ed__body { flex: 1; overflow-y: auto; display: grid; gap: 10px; align-content: start; padding: 16px clamp(16px, 3vw, 28px) 28px; }
.ed__count { color: var(--ink-soft); font-size: .92rem; }
.ed__status { display: none; margin: 0; padding: 12px 16px; text-align: center; background: var(--brown); color: var(--bg); font-size: .92rem; }
.ed__status.is-on { display: block; }
.ed__status.is-error { background: #a12b2b; }
.ed-row { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 6px 14px; align-items: center; padding: 10px; border: 1px solid var(--line); background: #fff; }

.ed-row__thumb { width: 56px; height: 70px; object-fit: cover; background: var(--photo-bg); }
.ed-row__name { font-weight: 500; overflow-wrap: anywhere; line-height: 1.25; }
.ed-row__meta { font-size: .88rem; color: var(--ink-soft); }
.ed-row__tools { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.ed-row__ask { font-weight: 500; }
@media (min-width: 760px) {
  .ed-row { grid-template-columns: 56px minmax(0, 1fr) auto; }
  .ed-row__tools { grid-column: 3; grid-row: 1; padding-top: 0; border-top: 0; justify-content: flex-end; }
}
.ed-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 16px; border: 1.5px solid var(--ink); border-radius: 999px; background: none; font-size: .92rem; transition: background-color .3s, color .3s; }
.ed-btn:hover { background: var(--brown); color: var(--bg); }
.ed-btn--danger { background: #a12b2b; border-color: #a12b2b; color: #fff; }
.ed-btn--danger:hover { background: #7f1f1f; }
.ed-icon { display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 1.5px solid var(--line); border-radius: 50%; background: #fff; }
.ed-icon:hover:not([disabled]) { border-color: var(--ink); }
.ed-icon[disabled] { opacity: .35; cursor: default; }
.ed-icon--danger { color: #a12b2b; }
.ed-switch { display: inline-flex; align-items: center; gap: 10px; min-height: 40px; cursor: pointer; }
.ed-switch input { appearance: none; -webkit-appearance: none; position: relative; flex: none; width: 44px; height: 26px; margin: 0; border-radius: 999px; background: #c9b9a8; cursor: pointer; transition: background-color .2s; }
.ed-switch input::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; }
.ed-switch input:checked { background: #2f6b3a; }
.ed-switch input:checked::after { transform: translateX(18px); }
.ed-form { display: grid; gap: 16px; max-width: 680px; }
.ed-form h3 { font-size: 1.5rem; font-weight: 300; }
.ed-form__row { display: grid; gap: 16px; }
@media (min-width: 640px) { .ed-form__row { grid-template-columns: 1fr 1fr; } }
.ed-form__switches { display: grid; gap: 2px; }
.ed-form__actions { display: flex; flex-wrap: wrap; gap: 12px; }
.ed-imgs legend { margin-bottom: 8px; }
.ed-imgs__main { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
.ed-imgs__preview { display: grid; place-items: center; width: 110px; aspect-ratio: 4 / 5; overflow: hidden; background: var(--photo-bg); border: 1.5px dashed var(--line); font-size: .85rem; color: var(--ink-soft); text-align: center; }
.ed-imgs__preview img { width: 100%; height: 100%; object-fit: cover; }
.ed-imgs__thumbs { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
.ed-thumb img { width: 88px; aspect-ratio: 4 / 5; object-fit: cover; border: 1px solid var(--line); }
.ed-thumb div { display: flex; gap: 4px; margin-top: 4px; }
.ed-thumb .ed-icon { width: 38px; height: 38px; }

<script>/* Utilidades e catálogo do painel; a loja lê o mesmo banco em index.html. */
(() => {
 'use strict';
 const CFG=window.SF_CONFIG||{};
 const $=(sel,root=document)=>root.querySelector(sel);
 const $$=(sel,root=document)=>Array.from(root.querySelectorAll(sel));
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
 const plainName=s=>String(s).replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu,'').replace(/\s+/g,' ').trim();
 const memory=new Map();
 const makeStore=kind=>({
  get(k){try{return window[kind].getItem(k);}catch(_){return memory.get(kind+k)||null;}},
  set(k,v){try{window[kind].setItem(k,v);}catch(_){memory.set(kind+k,v);}},
  remove(k){try{window[kind].removeItem(k);}catch(_){memory.delete(kind+k);}}
 });
 let products=[];
 const setRows=rows=>{
  products=rows.map((r,i)=>({id:String(r.id??'p'+i),name:String(r.name??'').trim(),price:r.price==null||r.price===''?null:Number(r.price),description:String(r.description??''),observation:String(r.observation??''),image:r.main_image||r.thumb||'',gallery:Array.isArray(r.gallery_images)?r.gallery_images:[],category:String(r.category??''),available:r.available!==false,active:r.active!==false,order:Number(r.sort_order)||i})).filter(p=>p.active&&p.name&&p.image).sort((a,b)=>a.order-b.order);
 };
 async function loadProducts(){
  const token=sessionStorage.getItem('sf_tk');if(!token)return;
  const db=window.SF_DB;
  const r=await fetch(db.url+'/rest/v1/rpc/sf_catalogo_admin',{method:'POST',headers:{apikey:db.key,'Content-Type':'application/json'},body:JSON.stringify({t:token})});
  const rows=await r.json();if(!r.ok)throw new Error(rows?.message||'Não foi possível carregar os produtos.');
  if(!Array.isArray(rows))throw new Error('Catálogo inválido.');setRows(rows);
 }
 window.SF={CFG,$,$$,esc,BRL,plainName,store:makeStore('localStorage'),sstore:makeStore('sessionStorage'),setRows,loadProducts,listProducts:()=>products,getProducts:()=>products.slice(),getProduct:id=>products.find(p=>p.id===id),refresh:()=>{}};
})();
</script>
<script>
/* =====================================================================
   SANTARÉM FLORES — editar produtos na própria página
   O botão discreto do catálogo (lápis) e o "+" do rodapé pedem usuário e
   senha e abrem a lista de produtos: adicionar, editar, excluir, ativar,
   ordenar e trocar fotos.
   SEGURANÇA: nenhuma senha existe neste arquivo. Com o Supabase configurado,
   o login é feito no servidor (Supabase Auth) e as regras RLS do banco
   impedem qualquer escrita de quem não é administrador.
   No arquivo de PRÉVIA existe um modo demonstração (DEMO_ADMIN): a senha é
   conferida por hash e as alterações ficam só no navegador de quem testa.
   ===================================================================== */
(() => {
  'use strict';
  const SF = window.SF;
  if (!SF) return;
  const { CFG, $, $$, esc, BRL } = SF;
  const loginDlg = $('#login');
  const editDlg = $('#editor');
  const BUCKET = CFG.STORAGE_BUCKET || 'product-images';
  const DOMAIN = CFG.ADMIN_EMAIL_DOMAIN || 'santaremflores.local';

  /* ---------- hash (só para o modo demonstração) ---------- */
  const SHA = (() => {
    const primes = [];
    for (let n = 2; primes.length < 64; n++) if (primes.every((q) => n % q)) primes.push(n);
    const frac = (x) => Math.floor((x - Math.floor(x)) * 4294967296);
    const K = primes.map((q) => frac(Math.cbrt(q)));
    const H0 = primes.slice(0, 8).map((q) => frac(Math.sqrt(q)));
    const rr = (x, n) => (x >>> n) | (x << (32 - n));
    return (str) => {
      const bytes = new TextEncoder().encode(str);
      const l = bytes.length;
      const blocks = Math.ceil((l + 9) / 64);
      const buf = new Uint8Array(blocks * 64);
      buf.set(bytes); buf[l] = 0x80;
      const dv = new DataView(buf.buffer);
      dv.setUint32(buf.length - 4, (l * 8) >>> 0);
      dv.setUint32(buf.length - 8, Math.floor((l * 8) / 4294967296));
      let H = H0.slice();
      const w = new Uint32Array(64);
      for (let b = 0; b < blocks; b++) {
        for (let i = 0; i < 16; i++) w[i] = dv.getUint32(b * 64 + i * 4);
        for (let i = 16; i < 64; i++) {
          const s0 = rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
          const s1 = rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
          w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
        }
        let [a, b2, c, d, e, f, g, h] = H;
        for (let i = 0; i < 64; i++) {
          const S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25);
          const t1 = (h + S1 + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0;
          const S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22);
          const t2 = (S0 + ((a & b2) ^ (a & c) ^ (b2 & c))) >>> 0;
          h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b2; b2 = a; a = (t1 + t2) >>> 0;
        }
        H = [H[0] + a, H[1] + b2, H[2] + c, H[3] + d, H[4] + e, H[5] + f, H[6] + g, H[7] + h].map((x) => x >>> 0);
      }
      return H.map((x) => x.toString(16).padStart(8, '0')).join('');
    };
  })();
  SF._sha256 = SHA; // usado só nos testes

  /* ---------- imagens ---------- */
  async function compress(file, max) {
    let bmp;
    try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (_) { bmp = await createImageBitmap(file); }
    const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bmp.width * scale);
    canvas.height = Math.round(bmp.height * scale);
    canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
    if (bmp.close) bmp.close();
    let blob = await new Promise((r) => canvas.toBlob(r, 'image/webp', 0.82));
    if (!blob || blob.type !== 'image/webp') blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.86));
    return blob;
  }
  const blobToDataUrl = (blob) => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
  const byOrder = (a, b) => (a.sort_order || 0) - (b.sort_order || 0);

  /* ---------- backends ---------- */
  // Catálogo no banco online (Supabase), usando o mesmo login do sistema
  const DBX = window.SF_DB, tk = () => { try { return sessionStorage.getItem('sf_tk') || ''; } catch (_) { return ''; } };
  const rpcx = async (fn, a) => {
    const r = await fetch(DBX.url + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: DBX.key, 'Content-Type': 'application/json' }, body: JSON.stringify(a || {}) });
    const j = await r.json().catch(() => null);
    if (!r.ok) { const e = new Error((j && j.message) || 'erro ' + r.status); e.code = (j && j.message) || ''; throw e; }
    return j;
  };
  const thumbOf = async (uri) => blobToDataUrl(await compress(await (await fetch(uri)).blob(), 520));
  window.SF_thumbs = async function () {
    if (window.__thumbRun) return; window.__thumbRun = true;
    try {
      const list = await rpcx('sf_catalogo_admin', { t: tk() });
      for (const r of list) { if (r.has_thumb || !r.main_image) continue; await rpcx('sf_prod_salvar', { t: tk(), p_id: r.id, p: { thumb: await thumbOf(r.main_image) } }); }
      try { localStorage.removeItem('sf:catalog:v2'); } catch (_) { /* ignora */ }
    } catch (_) { /* tenta no próximo acesso */ }
    window.__thumbRun = false;
  };
  const sfdb = {
    name: 'sfdb',
    async ready() { return true; },
    async session() { try { const m = JSON.parse(sessionStorage.getItem('sf_me') || 'null'); return !!tk() && !!m && (m.r === 'admin' || m.r === 'vendas'); } catch (_) { return false; } },
    async login(user, pass) {
      try {
        const r = await rpcx('sf_login', { p_e: user.trim().toLowerCase(), p_s: pass });
        if (r.papel !== 'admin' && r.papel !== 'vendas') return { ok: false, msg: 'Este usuário não tem acesso ao catálogo.' };
        sessionStorage.setItem('sf_tk', r.token); sessionStorage.setItem('sf_me', JSON.stringify({ n: r.nome, e: r.email, r: r.papel }));
        return { ok: true };
      } catch (_) { return { ok: false, msg: 'Usuário ou senha inválidos.' }; }
    },
    async logout() { /* a sessão é a do sistema interno */ },
    async list() {
      window.SF_CATS = await rpcx('sf_categorias');
      return (await rpcx('sf_catalogo_admin', { t: tk() })).sort(byOrder);
    },
    async save(id, payload) {
      if (payload.main_image) { try { payload.thumb = await thumbOf(payload.main_image); } catch (_) { /* segue sem miniatura */ } }
      await rpcx('sf_prod_salvar', { t: tk(), p_id: id, p: payload });
      try { localStorage.removeItem('sf:catalog:v2'); } catch (_) { /* ignora */ }
    },
    async remove(id) { await rpcx('sf_prod_del', { t: tk(), p_id: id }); },
    async reorder(ordered) { await rpcx('sf_prod_ordem', { t: tk(), p: ordered.map((o, k) => ({ id: o.id, sort: (k + 1) * 10 })) }); },
    async upload(file) { return blobToDataUrl(await compress(file, 1000)); },
    async dropImages() { /* imagens ficam dentro do produto */ }
  };
  const pickBackend = () => sfdb;
  let backend = null;

  /* ---------- entrada: botão do catálogo / "+" do rodapé ---------- */
  document.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-admin]');
    if (!b) return;
    e.preventDefault();
    backend = pickBackend();
    if (!backend) return openLogin('O painel ainda não está conectado. Configure o Supabase em js/config.js (veja o README).');
    try {
      if (await backend.session()) return openEditor();
    } catch (err) { console.warn('[editor]', err); }
    openLogin();
  });

  /* ---------- login ---------- */
  function openLogin(blockedMsg) {
    $('#login-inner').innerHTML = `
      <button class="detail__close" type="button" data-lg="close" aria-label="Fechar"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
      <div class="lg" id="lg-form" role="group" aria-labelledby="login-title">
        <img class="lg__logo" src="${esc($('.brand img').src)}" width="72" height="72" alt="">
        <h2 id="login-title">Acesso restrito</h2>
        ${blockedMsg ? `<p class="of__error" role="alert">${esc(blockedMsg)}</p>` : `
        <label class="of__field"><span>Usuário</span><input id="lg-user" name="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
        <label class="of__field"><span>Senha</span><input id="lg-pass" name="pass" type="password" autocomplete="current-password" required></label>
        <p class="of__error" id="lg-error" role="alert" hidden></p>
        <button class="btn btn--brown btn--block" id="lg-submit" type="button" data-lg="submit">Entrar</button>
        ${backend && backend.name === 'demo' ? '<p class="lg__note">Prévia em modo demonstração: as alterações ficam salvas só neste navegador.</p>' : ''}`}
      </div>`;
    if (!loginDlg.open) loginDlg.showModal();
    const u = $('#lg-user');
    if (u) u.focus();
  }
  $('#login-inner').addEventListener('click', (e) => {
    if (e.target.closest('[data-lg="close"]')) loginDlg.close();
    else if (e.target.closest('[data-lg="submit"]')) doLogin();
  });
  $('#login-inner').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('input')) { e.preventDefault(); doLogin(); } });
  async function doLogin() {
    const err = $('#lg-error');
    const btn = $('#lg-submit');
    if (!err || btn.disabled) return;
    err.hidden = true;
    const user = $('#lg-user').value;
    const pass = $('#lg-pass').value;
    if (!user.trim() || !pass) { err.textContent = 'Informe usuário e senha.'; err.hidden = false; return; }
    btn.disabled = true;
    try {
      const r = await backend.login(user, pass);
      if (!r.ok) { err.textContent = r.msg; err.hidden = false; return; }
      loginDlg.close();
      await openEditor();
    } catch (ex) {
      console.error('[editor] login', ex);
      err.textContent = 'Não foi possível conectar. Verifique a internet e tente de novo.';
      err.hidden = false;
    } finally { btn.disabled = false; }
  }

  /* ---------- editor ---------- */
  let rows = [];
  let editing = null;
  let form = { main: '', gallery: [] };
  let originalImages = [];
  let uploaded = [];
  let busy = 0;
  let confirmId = null;

  const money = (v) => (v == null ? 'Consulte o valor' : BRL.format(v));
  function status(msg, isErr) {
    const s = $('#ed-status');
    if (!s) return;
    s.textContent = msg;
    s.classList.toggle('is-error', !!isErr);
    s.classList.add('is-on');
    clearTimeout(status.t);
    status.t = setTimeout(() => s.classList.remove('is-on'), 3400);
  }
  function handleError(err, fallback) {
    console.error('[editor]', err);
    if (err && (err.code === 'PGRST301' || /jwt/i.test(err.message || '') || err.status === 401)) {
      editDlg.close();
      openLogin();
      return;
    }
    status(fallback, true);
  }

  async function openEditor() {
    $('#editor-inner').innerHTML = `
      <header class="ed__bar">
        <h2 id="editor-title">Produtos do site</h2>
        <div class="ed__actions">
          <button class="btn btn--brown btn--sm" type="button" data-ed="new"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span>Novo produto</span></button>
          <button class="btn btn--line btn--sm" type="button" data-ed="cats"><span>Categorias</span></button>
          <button class="ed__link" type="button" data-ed="logout">Sair</button>
          <button class="ed__x" type="button" data-ed="close" aria-label="Fechar"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
        </div>
      </header>
      <div class="ed__body" id="ed-body"></div>
      <p class="ed__status" id="ed-status" role="status" aria-live="polite"></p>`;
    if (!editDlg.open) editDlg.showModal();
    try { rows = await backend.list(); } catch (err) { return handleError(err, 'Não foi possível carregar os produtos.'); }
    renderList();
  }

  function renderList() {
    const active = rows.filter((r) => r.active).length;
    const body = $('#ed-body');
    body.innerHTML = `<p class="ed__count">${rows.length} ${rows.length === 1 ? 'produto' : 'produtos'}, ${active} ${active === 1 ? 'ativo' : 'ativos'} no site</p>` + (rows.length ? rows.map((r, i) => {
      const meta = [money(r.price), r.category, r.active ? '' : 'Oculto no site', r.available === false ? 'Indisponível' : ''].filter(Boolean).join(' · ');
      const asking = confirmId === r.id;
      return `<article class="ed-row${r.active ? '' : ' is-off'}" data-id="${esc(r.id)}">
        <img class="ed-row__thumb" src="${esc(r.main_image)}" alt="" width="56" height="70" loading="lazy">
        <div class="ed-row__info"><div class="ed-row__name">${esc(r.name)}</div><div class="ed-row__meta">${esc(meta)}</div></div>
        <div class="ed-row__tools">
          ${asking ? `<span class="ed-row__ask">Excluir este produto?</span>
            <button class="ed-btn ed-btn--danger" type="button" data-ed="del-yes">Sim, excluir</button>
            <button class="ed-btn" type="button" data-ed="del-no">Cancelar</button>` : `
          <label class="ed-switch"><input type="checkbox" data-ed="toggle" ${r.active ? 'checked' : ''} aria-label="Produto ativo: ${esc(r.name)}"><span>Ativo</span></label>
          <button class="ed-icon" type="button" data-ed="up" aria-label="Subir" ${i === 0 ? 'disabled' : ''}><svg class="icon" aria-hidden="true"><use href="#i-arrow-up"/></svg></button>
          <button class="ed-icon" type="button" data-ed="down" aria-label="Descer" ${i === rows.length - 1 ? 'disabled' : ''}><svg class="icon" aria-hidden="true"><use href="#i-arrow-down"/></svg></button>
          <button class="ed-btn" type="button" data-ed="edit"><svg class="icon" aria-hidden="true"><use href="#i-pencil"/></svg><span>Editar</span></button>
          <button class="ed-icon ed-icon--danger" type="button" data-ed="del" aria-label="Excluir ${esc(r.name)}"><svg class="icon" aria-hidden="true"><use href="#i-trash-2"/></svg></button>`}
        </div>
      </article>`;
    }).join('') : '<p class="ed__count">Nenhum produto ainda. Toque em “Novo produto”.</p>');
  }

  async function refreshAll() {
    rows = await backend.list();
    SF.setRows(rows);
    renderList();
  }

  editDlg.addEventListener('click', async (e) => {
    const t = e.target.closest('[data-ed]');
    if (!t) return;
    const act = t.dataset.ed;
    const rowEl = t.closest('.ed-row');
    const r = rowEl ? rows.find((x) => x.id === rowEl.dataset.id) : null;
    try {
      if (act === 'close') return editDlg.close();
      if (act === 'logout') { await backend.logout(); editDlg.close(); return; }
      if (act === 'new') return openForm(null);
      if (act === 'cats') return renderCats();
      if (act === 'cat-add') {
        const nome = ($('#ed-cat-new').value || '').trim(); if (nome.length < 2) return status('Digite o nome da categoria.', true);
        try { await rpcx('sf_cat_criar', { t: tk(), p_nome: nome }); window.SF_CATS = await rpcx('sf_categorias'); renderCats(); if (SF.refresh) SF.refresh(); return status('Categoria criada.'); }
        catch (e) { return status(/limite/.test(e.message) ? 'Limite de 8 categorias atingido.' : 'Não foi possível criar a categoria.', true); }
      }
      if (act === 'cat-del') {
        try { await rpcx('sf_cat_del', { t: tk(), p_nome: t.dataset.c }); window.SF_CATS = await rpcx('sf_categorias'); renderCats(); if (SF.refresh) SF.refresh(); return status('Categoria excluída.'); }
        catch (e) { return status(/uso/.test(e.message) ? 'Essa categoria tem produtos. Mude os produtos antes de excluir.' : 'Não foi possível excluir.', true); }
      }
      if (act === 'edit') return openForm(r);
      if (act === 'del') { confirmId = r.id; return renderList(); }
      if (act === 'del-no') { confirmId = null; return renderList(); }
      if (act === 'del-yes') {
        confirmId = null;
        await backend.remove(r.id);
        await backend.dropImages([r.main_image, ...(r.gallery_images || [])]);
        await refreshAll();
        return status('Produto excluído.');
      }
      if (act === 'up' || act === 'down') {
        const i = rows.findIndex((x) => x.id === r.id);
        const j = i + (act === 'up' ? -1 : 1);
        if (j < 0 || j >= rows.length) return;
        [rows[i], rows[j]] = [rows[j], rows[i]];
        renderList();
        await backend.reorder(rows);
        return refreshAll();
      }
      if (act === 'back') return cancelForm();
      if (act === 'save') return saveForm();
      if (act === 'main') return $('#ef-file-main').click();
      if (act === 'gal') return $('#ef-file-gal').click();
      if (act === 'g-remove' || act === 'g-cover') {
        const i = Number(t.dataset.i);
        if (act === 'g-remove') form.gallery.splice(i, 1);
        else { const old = form.main; form.main = form.gallery[i]; if (old) form.gallery[i] = old; else form.gallery.splice(i, 1); }
        return renderFormImages();
      }
    } catch (err) { handleError(err, 'Não foi possível concluir. Tente novamente.'); refreshAll().catch(() => {}); }
  });

  editDlg.addEventListener('change', async (e) => {
    const box = e.target.closest('[data-ed="toggle"]');
    if (box) {
      const r = rows.find((x) => x.id === box.closest('.ed-row').dataset.id);
      try {
        await backend.save(r.id, { active: box.checked });
        r.active = box.checked;
        await refreshAll();
        status(box.checked ? 'Produto ativado: aparece no site.' : 'Produto ocultado do site.');
      } catch (err) { box.checked = !box.checked; handleError(err, 'Não foi possível alterar o produto.'); }
      return;
    }
    if (e.target.id === 'ef-file-main') { addImages(e.target.files, 'main'); e.target.value = ''; }
    if (e.target.id === 'ef-file-gal') { addImages(e.target.files, 'gal'); e.target.value = ''; }
  });

  /* ---------- formulário ---------- */
  function renderCats() {
    const used = (c) => rows.filter((x) => x.category === c).length, cs = window.SF_CATS || [];
    $('#ed-body').innerHTML = `<button class="ed__link ed__back" type="button" data-ed="back"><svg class="icon" aria-hidden="true"><use href="#i-chevron-left"/></svg><span>Voltar para a lista</span></button>
      <div class="ed-form"><h3>Categorias (${cs.length}/8)</h3><p>Elas viram as abas do catálogo no site. No máximo 8.</p>
      <ul class="ed-cats">${cs.map((c) => `<li><span>${esc(c)}<small>${used(c)} produto(s)</small></span><button class="btn btn--line btn--sm" type="button" data-ed="cat-del" data-c="${esc(c)}" ${used(c) ? 'disabled title="Em uso"' : ''}>Excluir</button></li>`).join('')}</ul>
      ${cs.length < 8 ? '<div class="ed-cat-add"><input id="ed-cat-new" type="text" maxlength="30" placeholder="Nome da nova categoria"><button class="btn btn--brown btn--sm" type="button" data-ed="cat-add">Criar categoria</button></div>' : '<p>Limite de 8 categorias atingido.</p>'}</div>`;
  }
  function openForm(r) {
    if (r && r.id && !r._full) { status('Carregando produto…'); rpcx('sf_produto', { p_id: r.id }).then((f) => { Object.assign(r, f, { _full: true }); openForm(r); }).catch((e) => handleError(e, 'Não foi possível abrir o produto.')); return; }
    editing = r || null;
    form = { main: r?.main_image || '', gallery: [...(r?.gallery_images || [])] };
    originalImages = r ? [r.main_image, ...(r.gallery_images || [])] : [];
    uploaded = [];
    const cats = [...new Set(rows.map((x) => x.category).filter(Boolean))];
    $('#ed-body').innerHTML = `
      <button class="ed__link ed__back" type="button" data-ed="back"><svg class="icon" aria-hidden="true"><use href="#i-chevron-left"/></svg><span>Voltar para a lista</span></button>
      <div class="ed-form" id="ef" role="group" aria-label="Dados do produto">
        <h3>${r ? 'Editar produto' : 'Novo produto'}</h3>
        <label class="of__field"><span>Nome do produto</span><input id="ef-name" type="text" maxlength="120" required value="${esc(r?.name || '')}"></label>
        <div class="ed-form__row">
          <label class="of__field"><span>Preço (R$)</span><input id="ef-price" type="text" inputmode="decimal" placeholder="Ex.: 185,00" value="${r?.price != null ? Number(r.price).toFixed(2).replace('.', ',') : ''}"><small>Deixe em branco para mostrar “Consulte o valor”.</small></label>
          <label class="of__field"><span>Categoria</span><select id="ef-category"><option value="">Sem categoria</option>${[...new Set([...(window.SF_CATS || []), ...(r?.category ? [r.category] : [])])].map((c) => `<option value="${esc(c)}" ${c === (r?.category || "") ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></label>
        </div>
        <label class="of__field"><span>Descrição</span><textarea id="ef-desc" rows="2" maxlength="600" placeholder="Ex.: 12 rosas vermelhas.">${esc(r?.description || '')}</textarea></label>
        <label class="of__field"><span>Observação</span><textarea id="ef-obs" rows="2" maxlength="600" placeholder="Ex.: Verificar disponibilidade do leque.">${esc(r?.observation || '')}</textarea><small>Aparece nos detalhes do produto.</small></label>
        <fieldset class="of__field ed-imgs"><legend>Imagem principal</legend>
          <div class="ed-imgs__main"><div class="ed-imgs__preview" id="ef-main"></div>
          <button class="ed-btn" type="button" data-ed="main"><svg class="icon" aria-hidden="true"><use href="#i-image-plus"/></svg><span>Escolher foto</span></button></div>
          <input id="ef-file-main" type="file" accept="image/*" hidden>
        </fieldset>
        <fieldset class="of__field ed-imgs"><legend>Imagens adicionais</legend>
          <div class="ed-imgs__thumbs" id="ef-gal"></div>
          <button class="ed-btn" type="button" data-ed="gal"><svg class="icon" aria-hidden="true"><use href="#i-image-plus"/></svg><span>Adicionar fotos</span></button>
          <input id="ef-file-gal" type="file" accept="image/*" multiple hidden>
        </fieldset>
        <div class="ed-form__switches">
          <label class="ed-switch"><input id="ef-active" type="checkbox" ${!r || r.active ? 'checked' : ''}><span>Produto ativo (aparece no site)</span></label>
          <label class="ed-switch"><input id="ef-avail" type="checkbox" ${!r || r.available !== false ? 'checked' : ''}><span>Disponível para pedido</span></label>
        </div>
        <p class="of__error" id="ef-error" role="alert" hidden></p>
        <div class="ed-form__actions">
          <button class="btn btn--brown" id="ef-save" type="button" data-ed="save">Salvar produto</button>
          <button class="btn btn--line" type="button" data-ed="back">Cancelar</button>
        </div>
      </div>`;
    renderFormImages();
    $('#ef-name').focus();
  }

  function renderFormImages() {
    $('#ef-main').innerHTML = form.main ? `<img src="${esc(form.main)}" alt="Imagem principal">` : '<span>Nenhuma imagem</span>';
    $('#ef-gal').innerHTML = form.gallery.map((u, i) => `<div class="ed-thumb"><img src="${esc(u)}" alt="Foto adicional ${i + 1}" loading="lazy">
      <div><button class="ed-icon" type="button" data-ed="g-cover" data-i="${i}" aria-label="Usar como imagem principal"><svg class="icon" aria-hidden="true"><use href="#i-star"/></svg></button>
      <button class="ed-icon ed-icon--danger" type="button" data-ed="g-remove" data-i="${i}" aria-label="Remover foto"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button></div></div>`).join('');
  }

  async function addImages(files, target) {
    const list = Array.from(files).filter((f) => f.type.startsWith('image/'));
    if (!list.length) return status('Escolha um arquivo de imagem.', true);
    busy++;
    $('#ef-save').disabled = true;
    status(list.length > 1 ? 'Enviando fotos…' : 'Enviando foto…');
    try {
      for (const f of list) {
        const url = await backend.upload(f);
        uploaded.push(url);
        if (target === 'main') form.main = url; else form.gallery.push(url);
        $('#ef-error').hidden = true;
        renderFormImages();
      }
      status('Foto enviada.');
    } catch (err) {
      handleError(err, 'Não foi possível enviar a foto. Tente outra imagem.');
    } finally {
      busy--;
      if (!busy && $('#ef-save')) $('#ef-save').disabled = false;
    }
  }

  function parsePrice(raw) {
    let v = String(raw).replace(/R\$|\s/g, '');
    if (!v) return null;
    if (v.includes(',')) v = v.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(v)) v = v.replace(/\./g, '');
    const n = Number(v);
    return Number.isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : NaN;
  }

  async function cancelForm() {
    if (uploaded.length) await backend.dropImages(uploaded).catch(() => {});
    uploaded = [];
    renderList();
  }

  editDlg.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('#ef input[type="text"]')) { e.preventDefault(); saveForm(); } });
  async function saveForm() {
    if (!$('#ef') || $('#ef-save').disabled) return;
    const err = $('#ef-error');
    err.hidden = true;
    const fail = (m) => { err.textContent = m; err.hidden = false; };
    const name = $('#ef-name').value.trim();
    const price = parsePrice($('#ef-price').value);
    if (!name) return fail('Informe o nome do produto.');
    if (Number.isNaN(price)) return fail('Preço inválido. Use números, por exemplo 185,00.');
    if (!form.main) return fail('Escolha a imagem principal do produto.');
    const payload = {
      name, price,
      description: $('#ef-desc').value.trim() || null,
      observation: $('#ef-obs').value.trim() || null,
      category: $('#ef-category').value.trim() || null,
      main_image: form.main,
      gallery_images: form.gallery,
      active: $('#ef-active').checked,
      available: $('#ef-avail').checked
    };
    if (!editing) payload.sort_order = rows.reduce((m, r) => Math.max(m, r.sort_order || 0), 0) + 10;
    const btn = $('#ef-save');
    btn.disabled = true;
    try {
      await backend.save(editing ? editing.id : null, payload);
      const keep = new Set([form.main, ...form.gallery]);
      await backend.dropImages([...originalImages, ...uploaded].filter((u) => !keep.has(u)));
      uploaded = [];
      await refreshAll();
      status('Produto salvo. Já aparece no site.');
    } catch (ex) {
      if (ex && ex.name === 'QuotaExceededError') fail('O espaço do navegador acabou. Use fotos menores ou restaure o catálogo original.');
      else { console.error('[editor]', ex); fail('Não foi possível salvar. Confira os campos e tente de novo.'); }
      handleErrorAuth(ex);
    } finally { btn.disabled = busy > 0; }
  }
  function handleErrorAuth(ex) { if (ex && (ex.code === 'PGRST301' || /jwt/i.test(ex.message || ''))) { editDlg.close(); openLogin(); } }
})();

</script>
<script>
/* ===== SISTEMA INTERNO · Santarém das Flores =====
   Dados e contas ficam no banco online (Supabase); a senha é conferida no servidor. */
(function () {
  'use strict';
  var DB = window.SF_DB;
  var ST = ['Recebido', 'Em produção', 'Pronto', 'Saiu para entrega', 'Entregue', 'Cancelado'];
  var ROLES = { admin: 'Administrador', vendas: 'Vendas', producao: 'Produção', entrega: 'Entregador' };
  var TABS = { painel: ['Painel', 'admin'], vendas: ['Vendas', 'admin,vendas'], producao: ['Produção', 'admin,producao,vendas'], entregas: ['Entregas', 'admin,vendas,entrega'], estoque: ['Estoque', 'admin,producao,vendas'], financeiro: ['Financeiro', 'admin'], folha: ['Folha de pagamento', 'admin'], despesas: ['Despesas', 'admin'], rastreio: ['Rastreio', 'admin,vendas'], catalogo: ['Catálogo', 'admin,vendas'], usuarios: ['Usuários e senhas', 'admin'] };
  var $ = function (s) { return document.querySelector(s); };
  var E = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
